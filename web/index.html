<!doctype html>
<!--
What:       The chat page of the Airport Investment Intelligence Agent (Step 17).
Why:        The exam asks for a chat interface. This page is the only thing the user sees:
            a message box, the answers, the tables and the "How I got this" list.
Used by:    The browser. Served as plain files (locally on port 5500, online by Vercel).
Uses:       app.js (all the behaviour). No library, no CDN, no build tool, no external fonts.
Main parts: header (title, chat ID, New chat), the message list, the message box with
            the microphone button (only shown when the browser has speech recognition) and Send.
Design:     Implementation plan P92-P98, P104. The styles below keep the page readable at phone
            width (375 px): 16 px side margins, text wraps, and wide tables scroll sideways
            inside their own box, never the whole page (P97).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airport Investment Agent</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --ink: #1d2733; --muted: #5f6b7a; --line: #e3e7ec;
      --accent: #1f5fa8; --accent-soft: #e8f0fa; --warn-bg: #fff8e6; --warn-line: #f0d48a; --warn-ink: #6b4e00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 16px; line-height: 1.6; color: var(--ink); background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 820px; margin: 0 auto; padding: 0 16px; min-height: 100vh; display: flex; flex-direction: column; }

    header {
      position: sticky; top: 0; z-index: 2; background: var(--bg);
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px;
      padding: 18px 0 14px; border-bottom: 1px solid var(--line);
    }
    .brand { flex: 1 1 auto; min-width: 0; }
    header h1 { font-size: 20px; line-height: 1.3; margin: 0; letter-spacing: -0.01em; }
    .tagline { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
    #chat-id { font-size: 11px; color: #8a96a3; width: 100%; overflow-wrap: anywhere; order: 3; }

    button {
      font: inherit; font-size: 15px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--accent);
      background: var(--accent); color: #fff; cursor: pointer;
    }
    button.secondary { background: var(--card); color: var(--accent); border-color: #c5d3e3; }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { background: #c9d3de; border-color: #c9d3de; color: #f3f5f8; cursor: not-allowed; }

    #messages { flex: 1; padding: 20px 0 8px; min-width: 0; }
    .turn { margin-bottom: 36px; }
    .msg { overflow-wrap: anywhere; min-width: 0; }
    .user {
      margin: 0 0 14px auto; width: fit-content; max-width: 85%;
      background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 16px 16px 4px 16px;
      white-space: pre-wrap;
    }
    .bot {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 18px 22px; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }
    .bot-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

    /* The answer: short lines and clear spacing (P104) */
    .answer { max-width: 68ch; font-size: 16.5px; }
    .answer p { margin: 0 0 14px; }
    .answer h3 { font-size: 19px; line-height: 1.35; margin: 22px 0 8px; }
    .answer h4 { font-size: 16.5px; margin: 18px 0 6px; }
    .answer > :first-child { margin-top: 0; }
    .answer ul, .answer ol { margin: 0 0 14px; padding-left: 22px; }
    .answer li { margin: 0 0 6px; }
    .answer li::marker { color: var(--muted); }
    .answer strong { font-weight: 650; }
    .answer .table-scroll { margin: 4px 0 16px; }

    .working { color: var(--muted); font-style: italic; padding: 4px 2px; }
    .refusal { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
    .refusal p { margin: 0; }

    /* The tool tables, folded under the answer (P97, P104) */
    details.numbers { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 14px; color: var(--ink); }
    details.numbers > summary { color: var(--accent); font-weight: 600; }
    summary { cursor: pointer; }
    .table-block { margin: 16px 0 6px; }
    .table-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .table-scroll { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; }
    table { border-collapse: collapse; font-size: 13.5px; width: 100%; line-height: 1.4; }
    th, td { padding: 7px 10px; border-bottom: 1px solid #eef1f4; text-align: left; white-space: nowrap; }
    th { background: #f3f5f8; font-weight: 600; color: #3b4754; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:nth-child(even) td { background: #fafbfc; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .table-block details { font-size: 13px; margin-top: 6px; color: var(--muted); }
    .table-block details p { margin: 6px 0 2px; }
    .table-block details ul { margin: 0; padding-left: 20px; }

    .steps { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
    .steps h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #3b4754; }
    .steps ul { margin: 0; padding-left: 20px; }

    .composer {
      position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 16px;
      display: flex; gap: 8px; align-items: flex-end;
    }
    #message {
      flex: 1; min-width: 0; font: inherit; padding: 11px 14px; border: 1px solid #c5d0db; background: var(--card);
      border-radius: 10px; resize: vertical; min-height: 48px; max-height: 40vh;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
    }
    #message:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    #mic[hidden] { display: none; }

    @media (max-width: 480px) {
      .bot { padding: 14px 14px; }
      .answer { font-size: 16px; }
      .user { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <h1>Airport Investment Agent</h1>
        <p class="tagline">Find US airports where renovation pays off, from public flight data.</p>
      </div>
      <button id="new-chat" type="button" class="secondary">New chat</button>
      <div id="chat-id"></div>
    </header>
    <main id="messages" aria-live="polite"></main>
    <div class="composer">
      <textarea id="message" rows="2" placeholder="Ask about US airports… (Enter sends, Shift+Enter new line)" aria-label="Your question"></textarea>
      <button id="mic" type="button" class="secondary" title="Speak your question" aria-label="Speak your question" hidden>Mic</button>
      <button id="send" type="button">Send</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
